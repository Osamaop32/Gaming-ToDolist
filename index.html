<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming ToDo List</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen bg-[#020617] text-white flex justify-center items-center p-4">
    <main class="main w-full max-w-3xl">
        <h1 class="text-4xl font-extrabold text-center mb-3 tracking-widest text-cyan-400">
            🎮 GAMING TODO
        </h1>

        <p class="text-center text-cyan-300 mb-8 tracking-widest text-sm">
            LEVEL UP YOUR PRODUCTIVITY
        </p>

        <form id="taskForm" class="flex flex-col sm:flex-row gap-3 mb-6">
            <input
                type="text"
                id="Input"
                placeholder="Enter your next mission..."
                autocomplete="off"
                class="flex-1 min-w-0 w-full bg-[#0F172A] text-white border-2 border-cyan-500 rounded-xl p-4 outline-none focus:border-purple-500"
            >
            <button
                id="Button"
                type="button"
                onclick="add()"
                class="bg-gradient-to-r from-purple-700 to-blue-600 hover:from-cyan-500 hover:to-purple-600 text-white font-bold px-7 py-4 rounded-xl transition duration-300"
            >
                + ADD TASK
            </button>
        </form>

        <section class="list bg-[#0F172A] border border-purple-600 rounded-2xl p-5">
            <div class="mb-5">
                <h2 class="text-lg font-bold text-cyan-400 mb-3">⚡ YOUR MISSIONS</h2>
                <input
                    type="text"
                    id="search"
                    placeholder="🔍 Search your missions..."
                    autocomplete="off"
                    oninput="filterTask()"
                    class="w-full p-4 bg-[#020617] text-white border border-slate-700 rounded-xl outline-none focus:border-cyan-400"
                >
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gradient-to-r from-purple-700 via-indigo-600 to-cyan-700">
                        <tr>
                            <th class="p-4 rounded-tl-lg">#</th>
                            <th class="p-4">MISSION DETAILS</th>
                            <th class="p-4 rounded-tr-lg">ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="list"></tbody>
                </table>
            </div>

            <div class="border-t border-slate-700 mt-5 pt-4 text-center">
                <p class="text-xs text-slate-400 tracking-widest">
                    GAMING TODO SYSTEM | STAY FOCUSED 🎯
                </p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
